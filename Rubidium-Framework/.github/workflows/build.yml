name: Build Rubidium Framework

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rubidium-Framework
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build All Editions
      run: ./gradlew clean buildAllEditions --no-daemon
    
    - name: Verify Build Artifacts
      run: |
        echo "=== Checking Build Output ==="
        if [ ! -f "build/libs/rubidium.jar" ]; then
          echo "ERROR: rubidium.jar not found!"
          exit 1
        fi
        if [ ! -f "build/libs/rubidium_plus.jar" ]; then
          echo "ERROR: rubidium_plus.jar not found!"
          exit 1
        fi
        echo "Build successful!"
        ls -la build/libs/
    
    - name: Verify JAR Manifest Format
      run: |
        echo "=== Verifying Hytale Manifest Format ==="
        unzip -p build/libs/rubidium.jar manifests.json | head -20
        echo ""
        echo "=== Checking required fields ==="
        unzip -p build/libs/rubidium.jar manifests.json | grep -q '"Main"' && echo "Main field: OK" || echo "Main field: MISSING"
        unzip -p build/libs/rubidium.jar manifests.json | grep -q '"Name"' && echo "Name field: OK" || echo "Name field: MISSING"
        unzip -p build/libs/rubidium.jar manifests.json | grep -q '"Version"' && echo "Version field: OK" || echo "Version field: MISSING"
    
    - name: Build Example Mods
      run: |
        if [ -d "examples/joke-mod" ]; then
          cd examples/joke-mod
          chmod +x ../../gradlew 2>/dev/null || true
          ../../gradlew jar --no-daemon || echo "Example mod build skipped"
        fi
    
    - name: Run API Tests
      run: |
        mkdir -p build/classes/java/main
        javac -cp "build/libs/rubidium_plus.jar:libs/HytaleServer.jar" \
          -d build/classes/java/main \
          test-server/HytaleTestEnvironment.java 2>&1 || true
        echo "=== Running API Tests ==="
        timeout 60 java -cp "build/classes/java/main:build/libs/rubidium_plus.jar:libs/HytaleServer.jar" \
          rubidium.test.FullAPITest 2>&1 || echo "Tests completed or timed out"
      continue-on-error: true
    
    - name: List All Artifacts
      run: |
        echo "=== Rubidium Framework JARs ==="
        ls -la build/libs/
        echo ""
        echo "=== Example Mods ==="
        ls -la examples/*/build/libs/ 2>/dev/null || echo "No example mods built"
    
    - name: Upload Rubidium Free Edition
      uses: actions/upload-artifact@v4
      with:
        name: rubidium-free
        path: Rubidium-Framework/build/libs/rubidium.jar
        if-no-files-found: error
    
    - name: Upload Rubidium Plus Edition
      uses: actions/upload-artifact@v4
      with:
        name: rubidium-plus
        path: Rubidium-Framework/build/libs/rubidium_plus.jar
        if-no-files-found: error
    
    - name: Upload Example Mods
      uses: actions/upload-artifact@v4
      with:
        name: example-mods
        path: Rubidium-Framework/examples/*/build/libs/*.jar
        if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display downloaded artifacts
      run: ls -laR artifacts/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        generate_release_notes: true
        files: |
          artifacts/rubidium-free/rubidium.jar
          artifacts/rubidium-plus/rubidium_plus.jar
          artifacts/example-mods/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
