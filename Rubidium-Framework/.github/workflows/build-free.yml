name: Build Rubidium Free Edition

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-free:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rubidium-Framework
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25-ea'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Free Edition
      run: ./gradlew clean rubidiumFreeJar --no-daemon
    
    - name: Verify Build
      run: |
        echo "=== Checking Build Output ==="
        ls -la build/libs/
        if [ ! -f "build/libs/rubidium.jar" ]; then
          echo "ERROR: rubidium.jar not found!"
          exit 1
        fi
        echo "Build successful!"
    
    - name: Verify Manifest
      run: |
        echo "=== Manifest Content ==="
        unzip -p build/libs/rubidium.jar manifest.json
    
    - name: Upload Rubidium Free
      uses: actions/upload-artifact@v4
      with:
        name: rubidium
        path: Rubidium-Framework/build/libs/rubidium.jar
        if-no-files-found: error
